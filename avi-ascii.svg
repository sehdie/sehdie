<svg xmlns="http://www.w3.org/2000/svg" width="370" height="360" viewBox="0 0 370 360" role="img" aria-labelledby="title desc">
  <title id="title">ASCII portrait placeholder</title>
  <desc id="desc">Add source-photo.jpg and run the portrait scripts to generate the animated portrait.</desc>
  <rect width="370" height="360" rx="10" fill="#0d1117" stroke="#30363d"/>
  <text x="24" y="42" fill="#39d353" font-family="monospace" font-size="14">$ make portrait</text>
  <text x="24" y="76" fill="#c9d1d9" font-family="monospace" font-size="12">Add source-photo.jpg, then run:</text>
  <text x="24" y="104" fill="#8b949e" font-family="monospace" font-size="11">python scripts/prep_photo.py</text>
  <text x="24" y="124" fill="#8b949e" font-family="monospace" font-size="11">  source-photo.jpg</text>
  <text x="24" y="152" fill="#8b949e" font-family="monospace" font-size="11">python scripts/make_ascii_svg.py</text>
  <text x="24" y="206" fill="#39d353" font-family="monospace" font-size="12">[ portrait will type itself here ]</text>
</svg>
